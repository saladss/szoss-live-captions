name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller huggingface_hub gTTS

      - name: Build the package
        run: python packaging/build_windows.py build

      - name: Test the package on real speech
        run: python packaging/build_windows.py test

      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build-out/test-logs
            build-out/build-info.json
            build-out/test/SZOSS Captions/logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish release
        run: python packaging/build_windows.py release
